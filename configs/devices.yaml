# 현장 센서 설치 정보 — 2026-10 구매분 기준
#
# 두 경로로 들어온다.
#   Zigbee  : SONOFF Dongle Plus MG24 코디네이터 -> Zigbee2MQTT -> zigbee_bridge.py
#   433MHz  : RTL-SDR 동글 -> rtl_433 -> rtl433_bridge.py       (Ecowitt WS90)
#
# **map 이 중요하다.** 같은 temperature 라도 어디에 달렸느냐에 따라 다른
# 변수다 — 2m 마스트면 기온(t_air), 지상 10cm 면 초관부 온도(canopy_temp),
# 흙에 꽂으면 지온(soil_temp). 서리 판단은 이 셋을 구분하지 못하면 성립하지
# 않으므로, 뜻이 갈리는 필드는 기본값을 두지 않고 여기서 지정하게 했다.
# 적지 않으면 그 값은 버려지고 수집 로그에 사유가 남는다.
#
# zone: mast | treatment | control | facility
#
# ※ friendly_name(키)은 Zigbee2MQTT 웹UI 에서 장치를 페어링한 뒤 붙인 이름과
#   같아야 한다. 아래는 권장 이름이다. 페어링 후 Z2M 에서 이대로 바꾸면 된다.

devices:
  # ── 적용구간 ──────────────────────────────────────────────
  # Tuya Zigbee 온습도 센서 ×1
  #
  # 구매분이 1대뿐이라 적용구간에만 둔다. 비교구간 초관부 온도는 당분간
  # 대리지표(운량·풍속 기반 추정)로 간다. 서리 전·후 비교를 하려면 같은
  # 모델 1대가 더 필요하다.
  canopy-treat-01:
    zone: treatment
    sensor_id: CN-01
    note: 지상 10cm 초관부 · 라디에이션 실드 필요
    map:
      temperature: canopy_temp     # 지상 10cm 이므로 기온이 아니다
      humidity: rh

  # 지그비 스마트 투야 토양 수분·온도 센서
  # (최소주문 수량이 있으므로 실제 받은 대수에 맞춰 아래를 늘리거나 줄인다)
  soil-treat-01:
    zone: treatment
    sensor_id: SOIL-T1
    note: 깊이 10cm
    map:
      temperature: soil_temp       # 흙에 꽂혀 있으므로 지온이다

  soil-treat-02:
    zone: treatment
    sensor_id: SOIL-T2
    note: 깊이 20cm
    map:
      temperature: soil_temp

  # ── 비교구간 ──────────────────────────────────────────────
  soil-ctrl-01:
    zone: control
    sensor_id: SOIL-C1
    note: 깊이 10cm · 적용구간과 대칭
    map:
      temperature: soil_temp

  # ── 시설·안전 ─────────────────────────────────────────────
  # Zigbee 누수 센서 (110dB 알람) ×1
  leak-pump-01:
    zone: facility
    sensor_id: LEAK-01
    note: 펌프실 바닥 · 실내 전용(노지 설치는 강우 오검지)
    # water_leak 은 기본 매핑으로 enclosure_flood 가 된다

  # TUYA ZigBee 스마트 회로 차단기 1P 63A (전력계측) ×2
  #
  # 전류·전력은 '명령이 실제로 실행됐는지' 확인하는 신호다. 펌프가 돌면
  # 전류가 뜨고, 안 돌면 안 뜬다. 공인시험 T-07(제어응답)이 이것을 쓴다.
  breaker-pump-01:
    zone: facility
    sensor_id: PUMP-01
    note: 관수펌프 회로 · 220V 분전반(전기공사 유자격자 시공)
    map:
      current: pump_current
      power: pump_power
      voltage: line_voltage        # 배터리 장치와 달리 선간전압(V)이다

  breaker-aux-01:
    zone: facility
    sensor_id: AUX-01
    note: 보조 회로(환기·난방)
    map:
      current: motor_current
      power: pump_power
      voltage: line_voltage

  # Zigbee Tuya 스마트 워터밸브 + 유량계 ×1
  #
  # ※ 구매 시 'Zigbee 버전'이어야 한다. WiFi 버전이면 Zigbee2MQTT 로 들어오지
  #   않으므로 수집 경로가 통째로 달라진다. 페어링이 안 되면 이것부터 확인한다.
  valve-treat-01:
    zone: facility
    sensor_id: VALVE-01
    note: 적용구간 관수라인 DN20
    map:
      flow: irrigation_flow
      temperature: ""              # 밸브 몸체 온도다. 작물 판단에 쓰지 않는다

# ── 433MHz (Zigbee 아님) ────────────────────────────────────
# Ecowitt WS90 7-in-1 은 433MHz 전용 RF 라 위 목록에 들어가지 않는다.
# rtl433_bridge.py 가 따로 받는다:
#
#   rtl_433 -f 433.92M -F json | python scripts/rtl433_bridge.py --out data/field
#
# 설치: 노지 개활지 폴대 상단(지상 2m 이상), 적용구간·비교구간 공용 외기 기준.
# 주는 값: 기온·습도·풍속·순간최대풍속·풍향·강우·조도·UV·기압·배터리·슈퍼캡
#
# ※ WS90 의 순간최대풍속은 2초 간격으로 재어 **28초 창의 최댓값**이다.
#   사업계획서가 말하는 3초 순간최대와 다른 통계량이라 wind_gust_window 로
#   따로 받는다. 제어기는 참 3초 계측값이 있으면 그것을 먼저 쓰고, 없으면
#   이 값으로 물러서되 조치 사유에 어느 쪽인지 적는다.
