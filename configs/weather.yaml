# 기상 위험판단 모델 설정
#
# 위험 임계값은 사업계획서 '위험 정답값(라벨) 정의' 표의 초기 기준이다.
# 3자 검토(실증농가·재배/병해 전문가·AI 담당)에서 확정된 값으로 바꿔 쓴다.

data:
  aaos_dir: data/raw/aaos
  agera5_csv: data/raw/AgERA5_Naju-Daegyo_2x2mean_daily_2015-2026.csv
  # 노지 대파 실증 대상 기간. null 이면 연중 전체.
  # 겨울을 넣으면 1월 야간의 46%가 서리 주의가 되어 가을 서리 신호가 묻힌다.
  season_months: [9, 10, 11]
  horizons: [1, 3, 6]        # 1·3시간이 성능목표, 6시간은 참고 알림
  # 풍속이 기록되지 않는 지점이 이 지점들의 평균을 지역 대표값으로 쓴다
  wind_source_stations: ["나주시 금천면", "나주시 산포면"]

thresholds:
  heat_dry:
    caution_temp: 30.0        # ℃, 60분 이상
    caution_solar: 700.0      # W/m²
    warning_temp: 33.0
    warning_solar: 800.0
    dry_min_temp: 20.0        # 이 기온 미만의 토양 건조는 고온스트레스로 세지 않는다

  rain_wet:
    # "and" = 사업계획서 원문(강우 그리고 토양수분 상한)
    # "or"  = 권고안. 원문대로 두면 주의 표본이 작기 10년에서 20건까지 떨어진다.
    caution_mode: "and"
    caution_3h_mm: 20.0
    warning_6h_mm: 30.0
    wet_caution_hours: 2
    wet_warning_hours: 6

  disease:
    caution_wet_hours: 6      # 엽면습윤 연속시간
    caution_rh: 90.0
    caution_temp: [8.0, 24.0]
    warning_wet_hours: 10
    warning_rh: 95.0
    warning_temp: [12.0, 22.0]

  frost:
    caution_tmin: 4.0         # 예보 최저기온
    caution_wind: 2.0         # m/s 이하(정온)
    caution_cloud: 0.5        # 운량 0~1, 이하면 맑음
    caution_canopy: 2.0       # 초관부(지상 10cm) 온도 ℃
    warning_canopy: 0.0
    warning_canopy_hours: 1
    warning_tmin: 0.0

  soil:
    # soil_index(0~100) 기준 절대값. 분위수로 잡으면 겨울 건조까지 하한 이탈이 된다.
    low: 30.0
    high: 90.0

  wind:
    # 강풍은 AI 판단이 아니라 현장 즉응규칙(L1)이다.
    # 3초 순간최대풍속 기준이므로 시간평균 공공자료로는 판정할 수 없다.
    caution: 12.0
    warning: 15.0

soil_water_balance:
  capacity_mm: 60.0             # 대파는 천근성이라 유효토심이 얕다
  field_capacity_fraction: 0.75
  stress_fraction: 0.5          # 이 아래로 내려가면 실제 증발산이 줄기 시작
  drainage_rate: 0.25           # 포장용수량 초과분의 시간당 배수 비율

model:
  objective: multiclass
  num_class: 3
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 50
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  num_boost_round: 600
  early_stopping_rounds: 50

split:
  # 기상사례 블록 단위. 같은 사례가 학습셋과 시험셋에 쪼개지면 성능이 부풀려진다.
  test_size: 0.2
  valid_size: 0.2
  event_gap_hours: 12         # 블록 앞뒤 이 시간을 같은 블록에 포함
  seed: 42

targets:
  macro_f1: 0.80              # 위험유형별 종합점수
  risk_recall: 0.85           # 위험 놓침 방지율
  improvement_pp: 5.0         # 단순 기준값 대비 %p
  inference_seconds: 30       # AI 판단 소요시간

# 엣지 제어기 — 현장마다 다른 값
edge:
  # 구동부가 실제로 달린 장치만 적는다. 여기에 없는 장치로 가는 조치는
  # '실행'이 아니라 '권고(농가가 직접)'로 내려간다.
  #
  # 1차 구매분이 덮는 범위다. 차광막·야간피복·살수 구동부는 별도 발주이며,
  # 들어오면 아래에 이름을 더하면 된다 — 판단 로직은 건드리지 않는다.
  installed_devices:
    - 관수밸브
    - 전 구동부        # 스마트 차단기로 회로 차단
    - 해당 구동부

  # 기상청 단기예보 인증키. **저장소에 적지 않는다.**
  # 환경변수 OFDF_KMA_SERVICE_KEY 로 넘기는 것을 권한다.
  # 비워 두면 예보 없이 관측만으로 판단한다 — 판단이 멈추지는 않는다.
  kma_service_key: ""
