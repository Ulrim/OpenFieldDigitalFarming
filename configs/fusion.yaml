# 융합 판단 및 조치추천 설정

fusion:
  # 영상이 이보다 오래되면 현재 포장 상태로 믿지 않는다
  vision_stale_after_hours: 72
  # 최근 7일 유리환경 누적이 이 시간을 넘으면 감염압이 높다고 본다
  favourable_hours_7d_threshold: 48

control:
  # 판단 신뢰도가 이 값 미만이면 자동 실행하지 않고 농가 승인을 받는다
  confidence_threshold: 0.70

  field_rules:               # L1 — AI가 멈춰도 작동
    wind_no_deploy: 7.0      # m/s, 3초 순간최대. 전개 금지
    wind_recover: 9.0        # 즉시 완전 회수(5분 이내)
    wind_lock: 14.0          # 경보·구동 잠금, 현장 확인 후 수동 해제
    spray_stop_wind: 4.0     # 살수 중 이 풍속 초과 시 즉시 중지(비산 방지)
    comms_timeout_minutes: 3 # 서버 응답 미수신 시 로컬 독립운전

  shading:                   # 차광은 대파 생육기준 내에서만 제한 운영
    max_hours: 2
    earliest_hour: 10
    latest_hour: 16

  frost:
    night_start_hour: 18
    night_end_hour: 8
    # 야간·새벽 관수 금지 — 관수가 동결피해를 키운다
    block_irrigation: true

monitoring:
  psi_threshold: 0.2         # 입력분포 변화 경보
  recall_floor: 0.80         # 2주 연속 미만이면 재학습
  macro_f1_drop: 0.05        # 이만큼 떨어지면 재학습
